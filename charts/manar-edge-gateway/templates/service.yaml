apiVersion: v1
kind: Service
metadata:
  name: manar-edge-gateway
  labels: {{- include "gw.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.service.type "LoadBalancer" }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- end }}
  selector: {{- include "gw.selectorLabels" . | nindent 4 }}
  ports:
    - {name: wireguard, port: {{ .Values.service.port }}, targetPort: wireguard, protocol: UDP}
---
# Ingress: WireGuard from anywhere, metrics from the scrapers. Egress: manar-api (relay and sync
# API), DNS, and public HTTPS for the egress proxy. Nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: manar-edge-gateway
  labels: {{- include "gw.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "gw.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{port: 51820, protocol: UDP}]
    - from: {{- toYaml .Values.metricsFrom | nindent 8 }}
      ports: [{port: 9090, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: {{ .Values.manarApi.namespace }}}}
          podSelector:
            matchLabels: {{- toYaml .Values.manarApi.podLabels | nindent 14 }}
      ports:
        - {port: {{ .Values.manarApi.agentPort }}, protocol: TCP}
        - {port: {{ .Values.manarApi.httpPort }}, protocol: TCP}
    - to: {{- toYaml .Values.dnsTo | nindent 8 }}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: {{- toYaml .Values.internetExcept | nindent 14 }}
      ports:
        {{- range .Values.proxyPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
